<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ポケモンAPI</title>
  </head>
  <body>
    <main class="app">
      <h1>ポケモン検索</h1>

      <form id="searchForm" class="search">
        <input
          id="keyword"
          type="text"
          placeholder="英語スラッグか図鑑番号(数字)"
          required
        />
        <button type="submit">検索</button>
      </form>

      <div class="loader" hidden>
        <div class="spinner" aria-label="読み込み中"></div>
      </div>

      <p class="error" hidden></p>
      <article class="card" hidden></article>

      <div class="loader" hidden>
        <img class="spinner" src="./public/poke-ball.png" alt="" />
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
