<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- 1. forEach 次の配列 numbers
    を使用し、50以上の数値だけをコンソールへ表示してください。 forEach() と if
    を使用し、JavaScriptのコードのみを入力してください。 * const numbers = [35,
    80, 42, 67, 15, 90]; -->
    <script>
      const numbers = [35, 80, 42, 67, 15, 90];

      numbers.forEach((number) => {
        if (number >= 50) {
          console.log(number);
        }
      });
    </script>
  </body>
</html>
