<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //   次の配列booksを使用し、filter() を使って価格が2,000円未満の本を取得し、map() を使って本のタイトルだけの配列を作成し、さらに reduce() を使って本の価格の合計を求めてください。それぞれの結果をconsole.log()で表示してください。JavaScriptのコードのみを入力してください。

      const books = [
        { title: "HTML入門", price: 1800 },
        { title: "CSS入門", price: 2200 },
        { title: "JavaScript入門", price: 2500 },
        { title: "PHP入門", price: 1900 },
      ];

      const passedbooks = books.filter((book) => {
        return book.price < 2000;
      });

      console.log(passedbooks);

      const result = books.map((book) => {
        return `${book.title}`;
      });

      console.log(result);

      const total = books.reduce((sum, book) => sum + book.price, 0);

      console.log(total);
    </script>
  </body>
</html>
