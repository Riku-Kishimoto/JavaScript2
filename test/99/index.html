      const getTest = async () => {
        try {
          const res = await fetch("https://jsonplaceholder.typicode.com/todos");

          if (!res.ok) {
            throw new Error(`HTTPエラー: ${res.status}`);
          }
          const data = await res.json();
          return data;
        } catch (err) {
          console.error("取得に失敗しました", err);
          throw err;
        }
      };
      getTest();

      console.log(getTest);
    </script>
